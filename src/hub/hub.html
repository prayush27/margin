<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Margin</title>
    <link rel="icon" href="../../icons/icon-32.png" />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="hub.css" />
  </head>
  <body>
    <div class="app">
      <nav class="sidebar" aria-label="Margin">
        <a class="brand" href="#glossary">
          <span class="logo" aria-hidden="true"></span>
          <span>Margin</span>
        </a>

        <div class="nav" id="nav">
          <a href="#glossary" data-view="glossary">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 2.75h7.5a2 2 0 0 1 2 2v8.5H5a2 2 0 0 1-2-2V2.75Z" /><path d="M3 11.25a2 2 0 0 1 2-2h7.5" /></svg>
            Glossary <span class="n" id="navCount"></span>
          </a>
          <a href="#quiz" data-view="quiz">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2.5" y="3.5" width="11" height="9" rx="2" /><path d="M6.2 6.6a1.8 1.8 0 1 1 2.5 1.7c-.5.2-.7.6-.7 1.1M8 11h.01" stroke-linecap="round" /></svg>
            Quiz
          </a>
          <a href="#pdfs" data-view="pdfs">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 1.75h5l3.25 3.25v8.25a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2.75a1 1 0 0 1 1-1Z" /><path d="M9 1.75V5h3.25" /></svg>
            PDFs
          </a>
          <a href="#settings" data-view="settings">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2" /><path d="M8 1.75v1.5M8 12.75v1.5M14.25 8h-1.5M3.25 8h-1.5M12.4 3.6l-1.06 1.06M4.66 11.34 3.6 12.4M12.4 12.4l-1.06-1.06M4.66 4.66 3.6 3.6" stroke-linecap="round" /></svg>
            Settings
          </a>
        </div>

        <div class="section-label">
          Courses
          <button class="add" id="addCourse" title="New course" aria-label="New course">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9" /></svg>
          </button>
        </div>
        <div class="courses" id="courseList"></div>

        <div class="sidebar-foot">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5" /><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" /></svg>
          Saved only on this computer
        </div>
      </nav>

      <main class="main" id="main" tabindex="-1"></main>
    </div>

    <dialog class="dialog" id="termDialog">
      <form method="dialog" id="termForm">
        <h2 id="dialogTitle">Edit term</h2>
        <label class="label" for="fTerm">Term</label>
        <input class="input term-input" id="fTerm" name="term" required autocomplete="off" spellcheck="false" />
        <label class="label" for="fAliases">Also called <span class="faint">(optional, comma separated)</span></label>
        <input class="input" id="fAliases" name="aliases" autocomplete="off" placeholder="e.g. FIFO queue, Q" />
        <label class="label" for="fDef">Definition</label>
        <textarea class="textarea" id="fDef" name="definition" rows="4" placeholder="What does it mean? Your own words stick best."></textarea>
        <label class="label" for="fCourse">Course</label>
        <select class="select" id="fCourse" name="course"></select>
        <div class="context" id="fContext" hidden></div>
        <div class="dialog-foot">
          <button type="button" class="btn ghost danger" id="deleteTerm">Delete</button>
          <span class="spacer"></span>
          <button type="button" class="btn" id="cancelTerm">Cancel</button>
          <button type="submit" class="btn primary" id="saveTermBtn">Save</button>
        </div>
      </form>
    </dialog>

    <dialog class="dialog small" id="courseDialog">
      <form method="dialog" id="courseForm">
        <h2 id="courseDialogTitle">New course</h2>
        <label class="label" for="cName">Name</label>
        <input class="input" id="cName" required autocomplete="off" placeholder="e.g. CS 400" />
        <label class="label">Color</label>
        <div class="swatches" id="cColors"></div>
        <div class="dialog-foot">
          <button type="button" class="btn ghost danger" id="deleteCourse" hidden>Delete course</button>
          <span class="spacer"></span>
          <button type="button" class="btn" id="cancelCourse">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </dialog>

    <input type="file" id="importInput" accept=".json,.csv,application/json,text/csv" hidden />
    <script type="module" src="hub.js"></script>
  </body>
</html>
